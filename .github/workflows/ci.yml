name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Unit & API Tests
      run: |
        go test -v ./internal/generator/...
        go test -v ./cmd/panel/...

    - name: Build Master Panel & Agent
      run: |
        CGO_ENABLED=0 go build -v -o telegate-panel ./cmd/panel
        CGO_ENABLED=0 go build -v -o telegate-agent ./cmd/agent

version: '3.8'

services:
  telegate-panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile.panel
    container_name: telegate-panel
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - telegate_data:/data
    environment:
      - TELEGATE_LISTEN_ADDR=:8080
      - TELEGATE_STATE_FILE=/data/telegate_state.json
      - TELEGATE_ADMIN_USER=admin
      - TELEGATE_ADMIN_PASS=admin
      - TELEGATE_LOG_LEVEL=info

volumes:
  telegate_data:

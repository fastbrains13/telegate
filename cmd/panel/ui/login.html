<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TeleGate — Вход</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      max-width: 380px;
      margin: 100px auto 0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <h2>Вход в панель управления</h2>
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <input type="text" id="username" class="form-control" placeholder="username" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Войти</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          showToast('Неверное имя пользователя или пароль', 'error');
        }
      } catch (err) {
        showToast('Ошибка подключения к серверу', 'error');
      }
    });
  </script>
</body>
</html>

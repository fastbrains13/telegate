<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleGate — Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm p-8 rounded-2xl border border-zinc-800 bg-zinc-900 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h2 class="text-xl font-bold tracking-tight">TeleGate Login</h2>
      <p class="text-xs text-zinc-400">Панель управления Telegram Proxy</p>
    </div>

    <div id="auth-error" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-xs text-rose-500 text-center font-medium"></div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Логин</label>
        <input id="login-username" type="text" required class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-zinc-700 bg-transparent outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Пароль</label>
        <input id="login-password" type="password" required class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-zinc-700 bg-transparent outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-md transition">
        Войти в панель
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('auth-error');
      errBox.classList.add('hidden');
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      const res = await TG.login(username, password);
      if (res.ok) {
        window.location.href = '/index.html';
      } else {
        const text = await res.text();
        errBox.innerText = text || 'Ошибка авторизации';
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>

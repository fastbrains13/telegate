<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TeleGate — Настройка прокси</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">TeleGate</a>
    <nav>
      <a href="/index.html">Дашборд</a>
      <a href="/nodes.html">Узлы</a>
      <a href="/proxies.html" class="active">Настройки прокси</a>
      <a href="javascript:logout()">Выход</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="form-group" style="max-width: 400px;">
        <label for="nodeSelect">Выберите целевую ноду для настройки</label>
        <select id="nodeSelect" class="form-control">
          <option value="">Загрузка узлов...</option>
        </select>
      </div>
    </div>

    <form id="proxyForm" style="display: none;">
      <!-- Web Proxy Section -->
      <div class="card">
        <h2>Telegram Web Proxy (HTTPS / WSS)</h2>
        <div class="form-group">
          <label>
            <input type="checkbox" id="wpEnabled"> Включить Web Proxy на узле
          </label>
        </div>

        <div class="form-group">
          <label for="wpAddressMode">Адрес для клиентского подключения</label>
          <select id="wpAddressMode" class="form-control">
            <option value="ip">Использовать IP-адрес ноды</option>
            <option value="domain">Использовать кастомный домен (рекомендуется для TLS)</option>
          </select>
        </div>

        <div class="form-group" id="wpDomainGroup" style="display: none;">
          <label for="wpDomain">Доменное имя ноды (A-запись)</label>
          <input type="text" id="wpDomain" class="form-control" placeholder="proxy.example.com">
        </div>

        <div class="form-group">
          <label for="wpPort">Порт прокси</label>
          <input type="number" id="wpPort" class="form-control" placeholder="443" value="443">
        </div>

        <div class="form-group">
          <label for="wpPath">WebSocket Path</label>
          <input type="text" id="wpPath" class="form-control" placeholder="/ws" value="/ws">
        </div>

        <div class="form-group">
          <label for="wpSecret">Секретный ключ (32-значный hex)</label>
          <div class="input-group">
            <input type="text" id="wpSecret" class="form-control" placeholder="0123456789abcdef0123456789abcdef">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('wpSecret').value = generateHex(16)">Сгенерировать</button>
          </div>
        </div>

        <div class="form-group">
          <label>Клиентская ссылка для подключения</label>
          <div class="input-group">
            <input type="text" id="wpLink" class="form-control" readonly placeholder="tg://webproxy?server=...&port=...&secret=...">
            <button type="button" class="btn" onclick="copyToClipboard(document.getElementById('wpLink').value)">Копировать</button>
          </div>
        </div>
      </div>

      <!-- MTProto Fake-TLS Section -->
      <div class="card">
        <h2>Telegram MTProto Proxy (Fake-TLS)</h2>
        <div class="form-group">
          <label>
            <input type="checkbox" id="mtpEnabled"> Включить MTProto Proxy
          </label>
        </div>

        <div class="form-group">
          <label for="mtpPort">Порт прокси</label>
          <input type="number" id="mtpPort" class="form-control" placeholder="8443" value="8443">
        </div>

        <div class="form-group">
          <label for="mtpDomain">Домен для Fake-TLS маскировки (SNI)</label>
          <input type="text" id="mtpDomain" class="form-control" placeholder="example.org" value="example.org">
        </div>

        <div class="form-group">
          <label for="mtpSecret">Fake-TLS Секрет (ee + 16 hex + hex(domain))</label>
          <div class="input-group">
            <input type="text" id="mtpSecret" class="form-control" placeholder="ee0123456789abcdef0123456789abcdef...">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('mtpSecret').value = generateFakeTLSSecret(document.getElementById('mtpDomain').value)">Сгенерировать</button>
          </div>
        </div>

        <div class="form-group">
          <label>Клиентская ссылка для подключения</label>
          <div class="input-group">
            <input type="text" id="mtpLink" class="form-control" readonly placeholder="tg://proxy?server=...&port=...&secret=...">
            <button type="button" class="btn" onclick="copyToClipboard(document.getElementById('mtpLink').value)">Копировать</button>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button type="submit" class="btn btn-success" style="font-size: 1rem; padding: 12px 24px;">Сохранить настройки ноды</button>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
  <script>
    let currentNodes = [];
    let selectedNode = null;

    const urlParams = new URLSearchParams(window.location.search);
    const targetNodeId = urlParams.get('node_id');

    async function initPage() {
      try {
        const res = await fetch('/api/nodes');
        if (!res.ok) return;
        currentNodes = await res.json() || [];

        const sel = document.getElementById('nodeSelect');
        sel.innerHTML = '<option value="">-- Выберите узел --</option>' +
          currentNodes.map(n => `<option value="${n.id}">${n.name || n.id} (${n.ip || 'no-ip'})</option>`).join('');

        if (targetNodeId && currentNodes.some(n => n.id === targetNodeId)) {
          sel.value = targetNodeId;
          loadNodeForm(targetNodeId);
        } else if (currentNodes.length > 0) {
          sel.value = currentNodes[0].id;
          loadNodeForm(currentNodes[0].id);
        }

        sel.addEventListener('change', (e) => {
          if (e.target.value) {
            loadNodeForm(e.target.value);
          } else {
            document.getElementById('proxyForm').style.display = 'none';
          }
        });
      } catch (err) {
        showToast('Ошибка загрузки списка нод', 'error');
      }
    }

    function loadNodeForm(nodeId) {
      selectedNode = currentNodes.find(n => n.id === nodeId);
      if (!selectedNode) return;

      document.getElementById('proxyForm').style.display = 'block';

      // Заполнение Web Proxy
      const wp = selectedNode.web_proxy || {};
      document.getElementById('wpEnabled').checked = !!wp.enabled;
      document.getElementById('wpPort').value = wp.port || 443;
      document.getElementById('wpPath').value = wp.ws_path || '/ws';
      document.getElementById('wpSecret').value = wp.secret || '';
      document.getElementById('wpDomain').value = wp.domain || '';
      document.getElementById('wpAddressMode').value = wp.domain ? 'domain' : 'ip';
      toggleWpDomain();

      // Заполнение MTProto
      const mtp = selectedNode.mtproto || {};
      document.getElementById('mtpEnabled').checked = !!mtp.enabled;
      document.getElementById('mtpPort').value = mtp.port || 8443;
      document.getElementById('mtpDomain').value = mtp.fake_tls_domain || 'example.org';
      document.getElementById('mtpSecret').value = mtp.secret || '';

      updateLinks();
    }

    function toggleWpDomain() {
      const isDomain = document.getElementById('wpAddressMode').value === 'domain';
      document.getElementById('wpDomainGroup').style.display = isDomain ? 'block' : 'none';
    }

    document.getElementById('wpAddressMode').addEventListener('change', () => {
      toggleWpDomain();
      updateLinks();
    });

    function updateLinks() {
      if (!selectedNode) return;

      // Web Proxy Link
      const wpMode = document.getElementById('wpAddressMode').value;
      const wpHost = wpMode === 'domain' ? (document.getElementById('wpDomain').value.trim() || 'proxy.example.com') : (selectedNode.ip || '198.51.100.1');
      const wpPort = document.getElementById('wpPort').value || 443;
      const wpSecret = document.getElementById('wpSecret').value.trim();
      document.getElementById('wpLink').value = `tg://webproxy?server=${wpHost}&port=${wpPort}&secret=${wpSecret}`;

      // MTProto Link
      const mtpHost = selectedNode.ip || '198.51.100.1';
      const mtpPort = document.getElementById('mtpPort').value || 8443;
      const mtpSecret = document.getElementById('mtpSecret').value.trim();
      document.getElementById('mtpLink').value = `tg://proxy?server=${mtpHost}&port=${mtpPort}&secret=${mtpSecret}`;
    }

    ['wpDomain', 'wpPort', 'wpSecret', 'mtpPort', 'mtpSecret'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateLinks);
    });

    document.getElementById('proxyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedNode) return;

      const payload = {
        node_id: selectedNode.id,
        web_proxy: {
          enabled: document.getElementById('wpEnabled').checked,
          port: parseInt(document.getElementById('wpPort').value, 10) || 443,
          ws_path: document.getElementById('wpPath').value.trim() || '/ws',
          secret: document.getElementById('wpSecret').value.trim(),
          domain: document.getElementById('wpAddressMode').value === 'domain' ? document.getElementById('wpDomain').value.trim() : ""
        },
        mtproto: {
          enabled: document.getElementById('mtpEnabled').checked,
          port: parseInt(document.getElementById('mtpPort').value, 10) || 8443,
          fake_tls_domain: document.getElementById('mtpDomain').value.trim() || 'example.org',
          secret: document.getElementById('mtpSecret').value.trim()
        }
      };

      try {
        const res = await fetch('/api/nodes/save-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          showToast('Настройки прокси успешно сохранены в telegate_state.json!', 'success');
          // Обновляем локальный кэш текущей ноды без перезагрузки всей страницы
          selectedNode.web_proxy = payload.web_proxy;
          selectedNode.mtproto = payload.mtproto;
        } else {
          const errData = await res.text();
          showToast('Ошибка сохранения: ' + errData, 'error');
        }
      } catch (err) {
        showToast('Сетевая ошибка при сохранении', 'error');
      }
    });

    initPage();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleGate — Конфигуратор прокси</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex antialiased">

  <aside id="sidebar"></aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
    <header id="page-header"></header>

    <div class="p-8 max-w-7xl w-full mx-auto space-y-6">

      <div class="p-5 rounded-xl border border-zinc-800 bg-zinc-900/60 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <label class="text-xs font-medium text-zinc-400">Настраиваемый узел:</label>
          <select id="node-select" onchange="onSelectNode()" class="text-xs px-3.5 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-zinc-100 outline-none font-semibold"></select>
        </div>
        <div class="text-xs text-zinc-400">
          IP ноды: <span id="node-ip-label" class="font-mono text-zinc-200 font-semibold">--</span>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 1. WEB PROXY -->
        <div class="p-6 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm space-y-5">
          <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
              <h3 class="font-bold text-sm">Telegram Web Proxy (WSS)</h3>
            </div>
            <label class="inline-flex items-center gap-2 text-xs font-medium text-zinc-400 cursor-pointer">
              <span>Включен</span>
              <input id="web-enabled" type="checkbox" onchange="updateLinks()" class="w-4 h-4 accent-indigo-600">
            </label>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-medium text-zinc-400">Адрес подключения (Host):</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center gap-2 p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/60 text-xs cursor-pointer">
                <input type="radio" name="web-host-mode" value="ip" onchange="toggleWebHostMode()" checked class="accent-indigo-600">
                <span>IP узла (<span id="web-ip-preview" class="font-mono text-zinc-300">--</span>)</span>
              </label>
              <label class="flex items-center gap-2 p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/60 text-xs cursor-pointer">
                <input type="radio" name="web-host-mode" value="domain" onchange="toggleWebHostMode()" class="accent-indigo-600">
                <span>Свой домен</span>
              </label>
            </div>
            <input id="web-custom-domain" type="text" oninput="updateLinks()" placeholder="например, ge2.sa.fbinfo.ru" class="hidden w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">Порт *</label>
              <input id="web-port" type="number" oninput="updateLinks()" value="443" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">WebSocket Path</label>
              <input id="web-wspath" type="text" value="/" placeholder="/" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-zinc-400">Секрет (32 hex-символа) *</label>
              <button type="button" onclick="document.getElementById('web-secret').value=TG.genHex(16);updateLinks()" class="text-[11px] text-indigo-400 hover:text-indigo-300">🎲 Сгенерировать</button>
            </div>
            <input id="web-secret" type="text" oninput="updateLinks()" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">Fallback URL</label>
            <input id="web-fallback" type="text" value="https://ya.ru" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none">
          </div>

          <div class="p-3 rounded-lg border border-zinc-800 bg-zinc-950/40 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold">Upstream Relay</span>
              <select id="web-upstream" onchange="toggleWebUpstream()" class="text-xs px-2 py-1 rounded bg-zinc-800 border border-zinc-700">
                <option value="direct">Direct</option>
                <option value="vless">VLESS + Reality</option>
              </select>
            </div>
            <input id="web-vless" type="text" placeholder="vless://...@...:443?..." class="hidden w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div class="pt-2 border-t border-zinc-800 space-y-2">
            <span class="text-xs font-semibold block text-indigo-400">Клиентская ссылка Telegram:</span>
            <div class="flex items-center gap-2">
              <input id="web-link" readonly class="flex-1 text-[11px] font-mono p-2.5 rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-300 select-all outline-none">
              <button type="button" onclick="TG.copyText(document.getElementById('web-link').value);TG.toast('Скопировано!')" class="px-3 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-xs font-medium">Копировать</button>
            </div>
          </div>
        </div>

        <!-- 2. MTProto -->
        <div class="p-6 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm space-y-5">
          <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
              <h3 class="font-bold text-sm">Telegram MTProto (Fake-TLS)</h3>
            </div>
            <label class="inline-flex items-center gap-2 text-xs font-medium text-zinc-400 cursor-pointer">
              <span>Включен</span>
              <input id="mtproto-enabled" type="checkbox" onchange="updateLinks()" class="w-4 h-4 accent-emerald-600">
            </label>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-medium text-zinc-400">Адрес подключения (Host):</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center gap-2 p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/60 text-xs cursor-pointer">
                <input type="radio" name="mtproto-host-mode" value="ip" onchange="toggleMTProtoHostMode()" checked class="accent-emerald-600">
                <span>IP узла (<span id="mtproto-ip-preview" class="font-mono text-zinc-300">--</span>)</span>
              </label>
              <label class="flex items-center gap-2 p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/60 text-xs cursor-pointer">
                <input type="radio" name="mtproto-host-mode" value="domain" onchange="toggleMTProtoHostMode()" class="accent-emerald-600">
                <span>Свой домен</span>
              </label>
            </div>
            <input id="mtproto-custom-domain" type="text" oninput="updateLinks()" placeholder="например, ge2.sa.fbinfo.ru" class="hidden w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">Порт *</label>
              <input id="mtproto-port" type="number" oninput="updateLinks()" value="8443" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">Fake TLS домен *</label>
              <input id="mtproto-faketls-domain" type="text" value="yandex.ru" onchange="genMTProtoSecret()" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-zinc-400">Секрет (ee + hex + domain) *</label>
              <button type="button" onclick="genMTProtoSecret()" class="text-[11px] text-emerald-400 hover:text-emerald-300">🎲 Сгенерировать</button>
            </div>
            <input id="mtproto-secret" type="text" oninput="updateLinks()" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">Промо тег (Ad Tag)</label>
              <input id="mtproto-adtag" type="text" placeholder="1234abcd" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
            </div>
            <div>
              <label class="block text-xs font-medium text-zinc-400 mb-1">Лимит подключений</label>
              <input id="mtproto-maxclients" type="number" value="0" placeholder="0 = без лимита" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
            </div>
          </div>

          <div class="p-3 rounded-lg border border-zinc-800 bg-zinc-950/40 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold">Upstream Relay</span>
              <select id="mtproto-upstream" onchange="toggleMTProtoUpstream()" class="text-xs px-2 py-1 rounded bg-zinc-800 border border-zinc-700">
                <option value="direct">Direct</option>
                <option value="vless">VLESS + Reality</option>
              </select>
            </div>
            <input id="mtproto-vless" type="text" placeholder="vless://...@...:443?..." class="hidden w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
          </div>

          <div class="pt-2 border-t border-zinc-800 space-y-2">
            <span class="text-xs font-semibold block text-emerald-400">Клиентская ссылка Telegram:</span>
            <div class="flex items-center gap-2">
              <input id="mtproto-link" readonly class="flex-1 text-[11px] font-mono p-2.5 rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-300 select-all outline-none">
              <button type="button" onclick="TG.copyText(document.getElementById('mtproto-link').value);TG.toast('Скопировано!')" class="px-3 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-xs font-medium">Копировать</button>
            </div>
          </div>
        </div>

      </div>

      <div class="flex justify-end">
        <button id="btn-save-proxy" type="button" onclick="saveProxy()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md transition">
          💾 Сохранить и применить на ноде
        </button>
      </div>

    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let globalState = null;
    let currentId = null;

    async function init() {
      if (!(await TG.requireAuth())) return;
      TG.renderChrome('proxies', 'Конфигуратор прокси Telegram');
      globalState = await TG.getState();

      const select = document.getElementById('node-select');
      select.innerHTML = '';
      const nodes = Object.values(globalState.nodes || {});
      if (nodes.length === 0) return alert('Ноды не найдены. Сначала добавьте узел в дашборде.');

      nodes.forEach((n) => {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.innerText = `${n.name} (${n.ip})`;
        select.appendChild(opt);
      });

      const hashId = window.location.hash.replace('#', '');
      if (hashId && globalState.nodes[hashId]) select.value = hashId;
      else select.value = nodes[0].id;

      currentId = select.value;
      loadForm();
    }

    function onSelectNode() {
      currentId = document.getElementById('node-select').value;
      loadForm();
    }

    function loadForm() {
      if (!currentId || !globalState || !globalState.nodes[currentId]) return;
      const node = globalState.nodes[currentId];
      const web = node.web_proxy || {};
      const mt = node.mtproto || {};

      document.getElementById('node-ip-label').innerText = node.ip || 'no IP';
      document.getElementById('web-ip-preview').innerText = node.ip || 'no IP';
      document.getElementById('mtproto-ip-preview').innerText = node.ip || 'no IP';

      document.getElementById('web-enabled').checked = web.enabled !== undefined ? !!web.enabled : true;
      document.querySelector(`input[name="web-host-mode"][value="${web.host_mode || 'ip'}"]`).checked = true;
      document.getElementById('web-custom-domain').value = web.custom_domain || '';
      document.getElementById('web-port').value = web.port || 443;
      document.getElementById('web-secret').value = web.secret || TG.genHex(16);
      document.getElementById('web-wspath').value = web.ws_path || '/';
      document.getElementById('web-fallback').value = web.fallback_url || 'https://ya.ru';
      document.getElementById('web-upstream').value = web.upstream_type || 'direct';
      document.getElementById('web-vless').value = web.vless_url || '';

      document.getElementById('mtproto-enabled').checked = mt.enabled !== undefined ? !!mt.enabled : true;
      document.querySelector(`input[name="mtproto-host-mode"][value="${mt.host_mode || 'ip'}"]`).checked = true;
      document.getElementById('mtproto-custom-domain').value = mt.custom_domain || '';
      document.getElementById('mtproto-port').value = mt.port || 8443;
      document.getElementById('mtproto-faketls-domain').value = mt.fake_tls_domain || 'yandex.ru';
      document.getElementById('mtproto-secret').value = mt.secret || ('ee' + TG.genHex(16) + TG.strToHex('yandex.ru'));
      document.getElementById('mtproto-adtag').value = mt.ad_tag || '';
      document.getElementById('mtproto-maxclients').value = mt.max_clients || 0;
      document.getElementById('mtproto-upstream').value = mt.upstream_type || 'direct';
      document.getElementById('mtproto-vless').value = mt.vless_url || '';

      toggleWebHostMode();
      toggleMTProtoHostMode();
      toggleWebUpstream();
      toggleMTProtoUpstream();
      updateLinks();
    }

    function toggleWebHostMode() {
      const mode = document.querySelector('input[name="web-host-mode"]:checked')?.value || 'ip';
      document.getElementById('web-custom-domain').classList.toggle('hidden', mode !== 'domain');
      updateLinks();
    }

    function toggleMTProtoHostMode() {
      const mode = document.querySelector('input[name="mtproto-host-mode"]:checked')?.value || 'ip';
      document.getElementById('mtproto-custom-domain').classList.toggle('hidden', mode !== 'domain');
      updateLinks();
    }

    function toggleWebUpstream() {
      document.getElementById('web-vless').classList.toggle('hidden', document.getElementById('web-upstream').value !== 'vless');
    }

    function toggleMTProtoUpstream() {
      document.getElementById('mtproto-vless').classList.toggle('hidden', document.getElementById('mtproto-upstream').value !== 'vless');
    }

    function genMTProtoSecret() {
      const d = document.getElementById('mtproto-faketls-domain').value.trim() || 'yandex.ru';
      document.getElementById('mtproto-secret').value = 'ee' + TG.genHex(16) + TG.strToHex(d);
      updateLinks();
    }

    function updateLinks() {
      if (!currentId || !globalState || !globalState.nodes[currentId]) return;
      const node = globalState.nodes[currentId];

      const webMode = document.querySelector('input[name="web-host-mode"]:checked')?.value || 'ip';
      const webDomain = document.getElementById('web-custom-domain').value.trim();
      const webHost = (webMode === 'domain' && webDomain) ? webDomain : node.ip;
      const webPort = document.getElementById('web-port').value || 443;
      const webSec = document.getElementById('web-secret').value || '';

      const mtMode = document.querySelector('input[name="mtproto-host-mode"]:checked')?.value || 'ip';
      const mtDomain = document.getElementById('mtproto-custom-domain').value.trim();
      const mtHost = (mtMode === 'domain' && mtDomain) ? mtDomain : node.ip;
      const mtPort = document.getElementById('mtproto-port').value || 8443;
      const mtSec = document.getElementById('mtproto-secret').value || '';

      document.getElementById('web-link').value = `tg://webproxy?server=${webHost}&port=${webPort}&secret=${webSec}`;
      document.getElementById('mtproto-link').value = `tg://proxy?server=${mtHost}&port=${mtPort}&secret=${mtSec}`;
    }

    async function saveProxy() {
      if (!currentId) return;
      const btn = document.getElementById('btn-save-proxy');
      btn.innerText = '⏳ Сохранение...';

      const webMode = document.querySelector('input[name="web-host-mode"]:checked').value;
      const mtMode = document.querySelector('input[name="mtproto-host-mode"]:checked').value;

      const payload = {
        node_id: currentId,
        web_proxy: {
          enabled: document.getElementById('web-enabled').checked,
          host_mode: webMode,
          custom_domain: document.getElementById('web-custom-domain').value.trim(),
          port: parseInt(document.getElementById('web-port').value, 10),
          secret: document.getElementById('web-secret').value.trim(),
          ws_path: document.getElementById('web-wspath').value.trim() || '/',
          fallback_url: document.getElementById('web-fallback').value.trim() || 'https://ya.ru',
          max_clients: 0,
          upstream_type: document.getElementById('web-upstream').value,
          vless_url: document.getElementById('web-vless').value.trim(),
        },
        mtproto: {
          enabled: document.getElementById('mtproto-enabled').checked,
          host_mode: mtMode,
          custom_domain: document.getElementById('mtproto-custom-domain').value.trim(),
          port: parseInt(document.getElementById('mtproto-port').value, 10),
          secret: document.getElementById('mtproto-secret').value.trim(),
          fake_tls_domain: document.getElementById('mtproto-faketls-domain').value.trim(),
          ad_tag: document.getElementById('mtproto-adtag').value.trim(),
          max_clients: parseInt(document.getElementById('mtproto-maxclients').value, 10) || 0,
          upstream_type: document.getElementById('mtproto-upstream').value,
          vless_url: document.getElementById('mtproto-vless').value.trim(),
        },
      };

      try {
        const res = await TG.api('/api/nodes/save-proxy', { method: 'POST', body: JSON.stringify(payload) });
        if (res.ok) {
          if (globalState && globalState.nodes[currentId]) {
            globalState.nodes[currentId].web_proxy = payload.web_proxy;
            globalState.nodes[currentId].mtproto = payload.mtproto;
          }
          btn.innerText = '✅ Сохранено!';
          setTimeout(() => { btn.innerText = '💾 Сохранить и применить на ноде'; }, 2000);
          TG.toast('Конфиг применён на ноде');
        } else {
          btn.innerText = '💾 Сохранить и применить на ноде';
          TG.toast('Ошибка сервера: ' + await res.text(), 'err');
        }
      } catch (e) {
        btn.innerText = '💾 Сохранить и применить на ноде';
        TG.toast('Ошибка: ' + e, 'err');
      }
    }

    init();
  </script>
</body>
</html>

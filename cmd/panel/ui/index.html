<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TeleGate — Дашборд</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">TeleGate</a>
    <nav>
      <a href="/index.html" class="active">Дашборд</a>
      <a href="/nodes.html">Узлы (+Добавить)</a>
      <a href="/proxies.html">Настройки прокси</a>
      <a href="javascript:logout()">Выход</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2>Состояние кластера</h2>
        <a href="/nodes.html" class="btn btn-success">+ Подключить ноду</a>
      </div>
      
      <table class="table" id="nodesTable">
        <thead>
          <tr>
            <th>ID ноды</th>
            <th>Имя / Хост</th>
            <th>Статус</th>
            <th>CPU / RAM</th>
            <th>Последний пинг</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="nodesList">
          <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Загрузка узлов...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadNodes() {
      try {
        const res = await fetch('/api/nodes');
        if (!res.ok) return;
        const nodes = await res.json() || [];
        const tbody = document.getElementById('nodesList');
        
        if (nodes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Нет подключенных узлов. Нажмите «Подключить ноду».</td></tr>';
          return;
        }

        tbody.innerHTML = nodes.map(n => {
          const isOnline = n.is_online || (Date.now() - new Date(n.last_seen).getTime() < 30000);
          return `
            <tr>
              <td><code>${n.id}</code></td>
              <td><strong>${n.name || n.id}</strong><br><small style="color:var(--text-muted);">${n.ip || '-'}</small></td>
              <td>
                <span class="badge ${isOnline ? 'badge-online' : 'badge-offline'}">
                  ${isOnline ? 'ONLINE' : 'OFFLINE'}
                </span>
              </td>
              <td>${n.cpu_usage ? n.cpu_usage + '%' : '-'} / ${n.ram_usage ? n.ram_usage + '%' : '-'}</td>
              <td><small>${n.last_seen ? new Date(n.last_seen).toLocaleTimeString() : 'Никогда'}</small></td>
              <td>
                <a href="/proxies.html?node_id=${encodeURIComponent(n.id)}" class="btn" style="padding: 6px 12px; font-size: 0.8rem;">Прокси</a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error("Ошибка обновления списка нод:", err);
      }
    }

    loadNodes();
    // Polling работает безопасно только на этой странице
    setInterval(loadNodes, 5000);
  </script>
</body>
</html>

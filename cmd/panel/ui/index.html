<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleGate — Дашборд</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex antialiased">

  <aside id="sidebar"></aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
    <header id="page-header"></header>

    <div class="p-8 max-w-7xl w-full mx-auto space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="p-5 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm">
          <span class="text-xs font-medium text-zinc-500">Активные подключения</span>
          <div class="mt-2 flex items-baseline gap-2">
            <span id="stat-conns" class="text-2xl font-bold tracking-tight">0</span>
            <span class="text-xs text-emerald-500 font-medium">онлайн</span>
          </div>
        </div>
        <div class="p-5 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm">
          <span class="text-xs font-medium text-zinc-500">Протоколы Telegram</span>
          <div class="mt-2 flex items-center gap-1.5">
            <span class="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 font-semibold">Web Proxy (WSS)</span>
            <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-semibold">MTProto (Fake-TLS)</span>
          </div>
        </div>
        <div class="p-5 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm">
          <span class="text-xs font-medium text-zinc-500">Кластер</span>
          <div class="mt-2">
            <span id="stat-nodes-count" class="text-2xl font-bold tracking-tight text-indigo-400">0</span>
            <span class="text-xs text-zinc-400">узлов онлайн</span>
          </div>
        </div>
        <div class="p-5 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm">
          <span class="text-xs font-medium text-zinc-500">Правил блокировки</span>
          <div class="mt-2">
            <span id="stat-blacklist-count" class="text-2xl font-bold tracking-tight text-rose-500">0</span>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
          <h2 class="text-sm font-semibold tracking-tight">Серверные Ноды</h2>
          <span class="text-xs text-zinc-400">Синхронизация по защищенному токену</span>
        </div>
        <div id="nodes-container" class="divide-y divide-zinc-800"></div>
      </div>

    </div>
  </main>

  <!-- MODAL: ADD NODE -->
  <div id="add-node-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="w-full max-w-lg p-6 rounded-2xl border border-zinc-800 bg-zinc-900 shadow-2xl space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <h3 class="font-semibold text-sm">Добавить ноду в кластер</h3>
        <button onclick="closeAddNodeModal()" class="text-zinc-400 hover:text-zinc-200 text-lg">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Имя ноды</label>
          <input id="new-node-name" type="text" placeholder="GE2 SA FBINFO" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">IP сервера</label>
          <input id="new-node-ip" type="text" placeholder="89.34.219.142" class="w-full text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent outline-none font-mono">
        </div>
      </div>
      <div id="node-command-box" class="hidden space-y-2">
        <label class="block text-xs font-medium text-emerald-500">Запустите эту команду на целевом сервере:</label>
        <div class="flex items-center gap-2">
          <div class="flex-1 p-3 rounded-lg bg-zinc-950 font-mono text-[11px] text-zinc-300 break-all select-all border border-zinc-800" id="generated-command"></div>
          <button onclick="TG.copyText(document.getElementById('generated-command').textContent); TG.toast('Скопировано!')" class="px-3 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-xs font-medium">Копировать</button>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
        <button onclick="closeAddNodeModal()" class="px-4 py-2 text-xs font-medium rounded-lg hover:bg-zinc-800 transition">Закрыть</button>
        <button id="btn-create-node" onclick="createNode()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-sm">Сгенерировать ключ</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let globalState = null;

    async function init() {
      if (!(await TG.requireAuth())) return;
      TG.renderChrome('dashboard', 'Дашборд & Серверные Ноды',
        '<button onclick="openAddNodeModal()" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm transition">+ Добавить ноду</button>');
      await loadState();
      setInterval(loadState, 5000);
    }

    async function loadState() {
      try {
        globalState = await TG.getState();
        render();
      } catch (e) {
        console.error(e);
      }
    }

    function render() {
      if (!globalState) return;
      const nodesList = Object.values(globalState.nodes || {});
      document.getElementById('stat-nodes-count').innerText = nodesList.filter((n) => n.is_online).length;
      document.getElementById('stat-blacklist-count').innerText = (globalState.blacklist_cidr || []).length + (globalState.blacklist_countries || []).length;

      let totalConns = 0;
      const nodesContainer = document.getElementById('nodes-container');
      nodesContainer.innerHTML = '';

      if (nodesList.length === 0) {
        nodesContainer.innerHTML = '<div class="p-6 text-center text-xs text-zinc-500">Нет подключенных нод. Нажмите "+ Добавить ноду", чтобы подключить сервер.</div>';
      }

      nodesList.forEach((node) => {
        totalConns += (node.active_conns || []).length;
        const statusDot = node.is_online
          ? '<span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>'
          : '<span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500"></span>';

        nodesContainer.insertAdjacentHTML('beforeend', `
          <div class="p-5 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                ${statusDot}
                <span class="font-semibold text-sm">${TG.esc(node.name)}</span>
                <span class="font-mono text-xs text-zinc-400">(${TG.esc(node.ip || 'no IP')})</span>
                <span class="text-[11px] px-2 py-0.5 rounded font-medium ${node.is_online ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}">
                  ${node.is_online ? 'Online' : 'Offline'}
                </span>
              </div>
              <div class="text-xs text-zinc-400 mt-1">
                Подключений: <b>${(node.active_conns || []).length}</b> •
                Web Proxy: <b>${node.web_proxy && node.web_proxy.enabled ? 'Port ' + TG.esc(node.web_proxy.port) : 'Выкл'}</b> •
                MTProto: <b>${node.mtproto && node.mtproto.enabled ? 'Port ' + TG.esc(node.mtproto.port) : 'Выкл'}</b>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <a href="/proxies.html#${node.id}" class="px-3 py-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 rounded-lg inline-block">Настройки прокси</a>
              <button onclick="deleteNode('${node.id}')" class="px-3 py-1.5 text-xs text-rose-400 border border-rose-500/20 rounded-lg hover:bg-rose-500 hover:text-white transition">Удалить</button>
            </div>
          </div>
        `);
      });

      document.getElementById('stat-conns').innerText = totalConns;
    }

    function openAddNodeModal() {
      document.getElementById('new-node-name').value = '';
      document.getElementById('new-node-ip').value = '';
      document.getElementById('node-command-box').classList.add('hidden');
      document.getElementById('btn-create-node').classList.remove('hidden');
      document.getElementById('add-node-modal').classList.remove('hidden');
    }

    function closeAddNodeModal() {
      document.getElementById('add-node-modal').classList.add('hidden');
      loadState();
    }

    async function createNode() {
      const name = document.getElementById('new-node-name').value.trim();
      const ip = document.getElementById('new-node-ip').value.trim();
      if (!name) return TG.toast('Введите имя ноды', 'err');

      const res = await TG.api('/api/nodes/create', { method: 'POST', body: JSON.stringify({ name, ip }) });
      if (!res.ok) return TG.toast('Ошибка создания ноды', 'err');

      const data = await res.json();
      const host = window.location.host;
      const cmd = `curl -fsSL "http://${host}/bootstrap?token=${data.token}&id=${data.id}" | bash`;
      document.getElementById('generated-command').innerText = cmd;
      document.getElementById('node-command-box').classList.remove('hidden');
      document.getElementById('btn-create-node').classList.add('hidden');
    }

    async function deleteNode(id) {
      if (!confirm('Удалить ноду из кластера?')) return;
      await TG.api('/api/nodes/delete?id=' + encodeURIComponent(id), { method: 'DELETE' });
      loadState();
    }

    init();
  </script>
</body>
</html>

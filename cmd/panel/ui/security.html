<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleGate — Черный список</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex antialiased">

  <aside id="sidebar"></aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
    <header id="page-header"></header>

    <div class="p-8 max-w-7xl w-full mx-auto space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- IP / CIDR blacklist -->
        <div class="p-6 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm space-y-4">
          <h3 class="font-semibold text-sm">Черный список IP и CIDR-подсетей</h3>
          <div class="flex gap-2">
            <input id="input-ban-ip" type="text" placeholder="198.51.100.4 или 203.0.113.0/24" class="flex-1 text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-transparent font-mono outline-none">
            <button onclick="addBanIP()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-medium transition">Заблокировать</button>
          </div>
          <div id="blacklist-items" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar"></div>
        </div>

        <!-- Country blacklist -->
        <div class="p-6 rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm space-y-4">
          <h3 class="font-semibold text-sm">Блокировка стран (GeoIP)</h3>
          <div class="flex gap-2">
            <select id="country-select" class="flex-1 text-xs px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 outline-none">
              <option value="">Выберите страну...</option>
              <option value="CN">🇨🇳 Китай (CN)</option>
              <option value="IR">🇮🇷 Иран (IR)</option>
              <option value="RU">🇷🇺 Россия (RU)</option>
              <option value="US">🇺🇸 США (US)</option>
              <option value="UA">🇺🇦 Украина (UA)</option>
              <option value="TR">🇹🇷 Турция (TR)</option>
              <option value="IN">🇮🇳 Индия (IN)</option>
              <option value="BR">🇧🇷 Бразилия (BR)</option>
              <option value="DE">🇩🇪 Германия (DE)</option>
              <option value="NL">🇳🇱 Нидерланды (NL)</option>
              <option value="KP">🇰🇵 Северная Корея (KP)</option>
            </select>
            <button onclick="addSelectedCountry()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition">Заблокировать</button>
          </div>
          <div id="blacklist-countries" class="flex flex-wrap gap-2"></div>
        </div>

      </div>

    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let globalState = null;

    const countryFlags = {
      'CN': '🇨🇳 Китай', 'IR': '🇮🇷 Иран', 'RU': '🇷🇺 Россия',
      'US': '🇺🇸 США', 'UA': '🇺🇦 Украина', 'TR': '🇹🇷 Турция',
      'IN': '🇮🇳 Индия', 'BR': '🇧🇷 Бразилия', 'DE': '🇩🇪 Германия',
      'NL': '🇳🇱 Нидерланды', 'KP': '🇰🇵 КНДР'
    };

    async function init() {
      if (!(await TG.requireAuth())) return;
      TG.renderChrome('security', 'Черный список & GeoIP');
      await loadState();
    }

    async function loadState() {
      try {
        globalState = await TG.getState();
        render();
      } catch (e) { console.error(e); }
    }

    function render() {
      if (!globalState) return;

      const blContainer = document.getElementById('blacklist-items');
      blContainer.innerHTML = '';
      (globalState.blacklist_cidr || []).forEach((ip) => {
        blContainer.insertAdjacentHTML('beforeend', `
          <div class="flex items-center justify-between p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/40 text-xs font-mono">
            <span class="text-rose-500 font-semibold">${TG.esc(ip)}</span>
            <button onclick="removeBan('${TG.esc(ip)}')" class="text-zinc-400 hover:text-rose-500 font-sans">✕</button>
          </div>
        `);
      });

      const cContainer = document.getElementById('blacklist-countries');
      cContainer.innerHTML = '';
      (globalState.blacklist_countries || []).forEach((c) => {
        const title = countryFlags[c] || c;
        cContainer.insertAdjacentHTML('beforeend', `
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-zinc-800 border border-zinc-700">
            <span>${TG.esc(title)}</span>
            <button onclick="removeCountryBan('${TG.esc(c)}')" class="text-zinc-400 hover:text-rose-500">✕</button>
          </span>
        `);
      });
    }

    async function addBanIP() {
      const ip = document.getElementById('input-ban-ip').value.trim();
      if (!ip) return;
      await TG.api('/api/blacklist/ip', { method: 'POST', body: JSON.stringify({ ip }) });
      document.getElementById('input-ban-ip').value = '';
      loadState();
      TG.toast('IP заблокирован');
    }

    async function removeBan(ip) {
      await TG.api('/api/blacklist/ip?ip=' + encodeURIComponent(ip), { method: 'DELETE' });
      loadState();
    }

    async function addSelectedCountry() {
      const select = document.getElementById('country-select');
      const c = select.value;
      if (!c) return;
      await TG.api('/api/blacklist/country', { method: 'POST', body: JSON.stringify({ country: c }) });
      select.value = '';
      loadState();
      TG.toast('Страна заблокирована');
    }

    async function removeCountryBan(c) {
      await TG.api('/api/blacklist/country?country=' + encodeURIComponent(c), { method: 'DELETE' });
      loadState();
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleGate — Подключения</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex antialiased">

  <aside id="sidebar"></aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
    <header id="page-header"></header>

    <div class="p-8 max-w-7xl w-full mx-auto space-y-6">

      <div class="rounded-xl border border-zinc-800 bg-zinc-900/60 shadow-sm overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-zinc-900 border-b border-zinc-800 text-zinc-400 font-medium">
            <tr>
              <th class="py-3 px-4">Клиентский IP</th>
              <th class="py-3 px-4">Локация / Провайдер</th>
              <th class="py-3 px-4">Протокол</th>
              <th class="py-3 px-4">Маршрут</th>
              <th class="py-3 px-4 text-right">Действие</th>
            </tr>
          </thead>
          <tbody id="conns-table-body" class="divide-y divide-zinc-800 font-mono"></tbody>
        </table>
        <div id="conns-empty" class="p-6 text-center text-xs text-zinc-500 hidden">Нет активных подключений</div>
      </div>

    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let globalState = null;

    async function init() {
      if (!(await TG.requireAuth())) return;
      TG.renderChrome('connections', 'Подключения & IP');
      await loadState();
      setInterval(loadState, 5000);
    }

    async function loadState() {
      try {
        globalState = await TG.getState();
        render();
      } catch (e) { console.error(e); }
    }

    function render() {
      if (!globalState) return;
      const tbody = document.getElementById('conns-table-body');
      const empty = document.getElementById('conns-empty');
      tbody.innerHTML = '';

      let hasConns = false;
      const nodesList = Object.values(globalState.nodes || {});
      nodesList.forEach((node) => {
        (node.active_conns || []).forEach((c) => {
          hasConns = true;
          tbody.insertAdjacentHTML('beforeend', `
            <tr class="hover:bg-zinc-800/20">
              <td class="py-3 px-4 font-semibold">${TG.esc(c.ip)}</td>
              <td class="py-3 px-4 font-sans">${TG.esc(c.country || 'Unknown')} • ${TG.esc(c.isp || 'Peer')}</td>
              <td class="py-3 px-4 font-sans text-indigo-400">${TG.esc(c.protocol)}</td>
              <td class="py-3 px-4 font-sans text-emerald-400">${TG.esc(c.outbound)}</td>
              <td class="py-3 px-4 text-right">
                <button onclick="executeBan('${TG.esc(c.ip)}')" class="px-2.5 py-1 text-[11px] rounded bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white transition font-sans">В бан</button>
              </td>
            </tr>
          `);
        });
      });

      empty.classList.toggle('hidden', hasConns);
    }

    async function executeBan(ip) {
      if (!confirm(`Заблокировать IP ${ip}?`)) return;
      await TG.api('/api/blacklist/ip', { method: 'POST', body: JSON.stringify({ ip }) });
      loadState();
      TG.toast('IP добавлен в черный список');
    }

    init();
  </script>
</body>
</html>
